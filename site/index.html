<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="meta.title"></title>

    <!-- Google Fonts : Cormorant Garamond (titres) + Raleway (corps) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700&family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <!-- Charger les traductions AVANT main.js -->
    <script src="js/translations.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body>

<header class="header">

    <div class="logo">
        <img data-test="logo" src="img/logo-option-3.svg" alt="Logo Roberto Villalva">
    </div>

    <div class="nav-wrapper">

        <div class="lang-row">
            <div class="lang-switch">
                <button id="switch-fr" class="active" data-test="lang-fr">FR</button>
                <button id="switch-es" data-test="lang-es">ES</button>
                <button id="switch-de" data-test="lang-de">DE</button>
                <button id="switch-en" data-test="lang-en">EN</button>
            </div>
        </div>

        <nav class="nav">
            <a href="#intro" data-key="menu.home" data-test="nav-home"></a>
            <a href="#about" data-key="menu.about" data-test="nav-about"></a>
            <a href="#services" data-key="menu.services" data-test="nav-services"></a>
            <a href="#pricing" data-key="menu.pricing" data-test="nav-pricing"></a>
            <a href="#contact" data-key="menu.contact" data-test="nav-contact"></a>
        </nav>

    </div>

</header>

<main>

<section id="intro" class="section hero" data-test="section-hero">
    <h1 data-key="hero.title"></h1>
    <p data-key="hero.subtitle"></p>
    <a href="#services" class="btn" data-key="hero.cta"></a>
</section>

<section id="about" class="section about" data-test="section-about">
    <h2 data-key="about.title" data-test="title-about"></h2>
    <p data-key="about.p1"></p>
    <p data-key="about.p2"></p>
</section>

<section id="services" class="section services" data-test="section-services">
    <h2 data-key="services.title" data-test="title-services"></h2>

    <div class="service-grid">

        <div class="service-card" data-test="service-tile">
            <h4 data-key="services.s1_title" data-test="service-tile-title"></h4>
            <p data-key="services.s1_text"></p>
        </div>

        <div class="service-card" data-test="service-tile">
            <h4 data-key="services.s2_title" data-test="service-tile-title"></h4>
            <p data-key="services.s2_text"></p>
        </div>

        <div class="service-card" data-test="service-tile">
            <h4 data-key="services.s3_title" data-test="service-tile-title"></h4>
            <p data-key="services.s3_text"></p>
        </div>

    </div>

    <div class="colleague-note" data-test="colleague-note">
        <h4 data-key="colleague.title" data-test="colleague-title"></h4>
        <p><span data-key="colleague.p1a"></span><a id="colleague-link" data-test="colleague-link" href="https://tradumyre.de/fr/" target="_blank" rel="noopener noreferrer">Josianne Myre</a><span data-key="colleague.p1b"></span> <a href="mailto:info@tradumyre.de" data-test="colleague-email">info@tradumyre.de</a></p>
    </div>
</section>

<section id="pricing" class="section pricing" data-test="section-pricing">
    <h2 data-key="pricing.title" data-test="title-pricing"></h2>
    <p data-key="pricing.p1"></p>
    <p data-key="pricing.p2"></p>
    <a class="btn" href="mailto:roberto@villalva.ca" data-key="pricing.cta"></a>
</section>

<section id="contact" class="section contact" data-test="section-contact">
    <h2 data-key="contact.title" data-test="title-contact"></h2>
    <p data-key="contact.p1"></p>

    <p><strong>Email :</strong> <a href="mailto:roberto@villalva.ca" data-test="contact-email">roberto@villalva.ca</a></p>
    <p><strong>Téléphone :</strong> <a href="tel:5145006472" data-test="contact-phone">514‑500‑6472</a></p>
</section>

</main>

</body>
</html>
